name: check

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: make tools

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: InspectCode
        if: ${{ !cancelled() }}
        run: make inspect

      - name: RefTrace
        if: ${{ !cancelled() }}
        run: make verify-dll

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifacts
          path: |
            artifacts/**/*.trx
            artifacts/*.sarif
            artifacts/*.json
            artifacts/*.binlog
          if-no-files-found: ignore
