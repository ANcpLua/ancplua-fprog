name: check

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.intent.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Identify release intent
        id: intent
        run: python3 -B scripts/release.py intent

      - name: Check release orchestration
        run: python3 -B scripts/test_release.py

      - name: Restore local tools
        run: make tools

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: InspectCode
        if: ${{ !cancelled() }}
        run: make inspect

      - name: RefTrace
        if: ${{ !cancelled() }}
        run: make verify-dll

      - name: Demo
        if: ${{ !cancelled() }}
        run: python3 demo/count.py

      # The account's artifact storage can run full; a failed upload must not fail the gate.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: artifacts
          path: |
            artifacts/**/*.trx
            artifacts/*.sarif
            artifacts/*.json
            artifacts/*.binlog
          if-no-files-found: ignore
          retention-days: 1

  pack:
    needs: check
    if: ${{ needs.check.outputs.release_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Exercise the CI package in the production Playground
        id: playground
        run: |
          set -euo pipefail
          version=$(dotnet msbuild ancplua-fprog/ancplua-fprog.csproj -getProperty:VersionPrefix -nologo)
          python3 -B scripts/release.py pack --version "${version}-ci.${GITHUB_RUN_NUMBER}" --output "$RUNNER_TEMP/fprog-package"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nupkg
          path: ${{ steps.playground.outputs.candidate }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary pack outputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/fprog-package"

  publish:
    needs: check
    if: >-
      github.repository == 'ANcpLua/ancplua-fprog' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.check.outputs.release_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nuget
    concurrency:
      group: publish-analyzer-${{ needs.check.outputs.release_version }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Acceptance-test the exact stable package to submit
        id: playground
        run: python3 -B scripts/release.py pack --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/fprog-package"

      - name: Reserve the release tag and check existing publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.playground.outputs.digest }}
        run: python3 -B scripts/release.py preflight --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --digest "$PAYLOAD"

      - name: NuGet login with OIDC
        if: steps.plan.outputs.should_push == 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Submit the tested archive to nuget.org
        if: steps.plan.outputs.should_push == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          CANDIDATE: ${{ steps.playground.outputs.candidate }}
          PAYLOAD: ${{ steps.playground.outputs.digest }}
        run: python3 -B scripts/release.py push --candidate "$CANDIDATE" --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --digest "$PAYLOAD"

      - name: Record acceptance in the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.playground.outputs.digest }}
        run: python3 -B scripts/release.py finish --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --digest "$PAYLOAD"

      - name: Remove temporary pack outputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/fprog-package"
